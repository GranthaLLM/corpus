<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grantha corpus audit sheet</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#dcdad2;--acc:#1f5f4a;--bad:#9a3412;--sel:#e6f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ecebe5;--mute:#9a988f;--line:#34332e;--acc:#6cc3a3;--bad:#f0a070;--sel:#23372f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:18px 20px 80px}
.unit{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 18px;padding:14px 16px}
.unit.done{border-left:4px solid var(--acc)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--mute);font-size:13px;margin-bottom:8px}
.meta b{color:var(--ink);font-size:14px}
code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto;white-space:pre-wrap;background:var(--bg)}
.sk{font-family:"Kohinoor Devanagari","Noto Serif Devanagari","Devanagari Sangam MN",serif;font-size:18px;line-height:1.7}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 4px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.opts label{border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
.opts input{display:none}
.opts label:has(input:checked){background:var(--sel);border-color:var(--acc);font-weight:600}
.opts label small{color:var(--mute);margin-left:4px}
input.note{width:100%;margin-top:8px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mute);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.hint{color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Corpus audit sheet</h1>
  <span id="count"></span>
  <div class="bar"><i id="bar"></i></div>
  <select id="filter"><option value="all">All units</option><option value="todo">Unmarked</option><option value="bad">Marked wrong</option></select>
  <button id="resBtn">Results</button>
  <button id="expJson">Export JSON</button>
  <button id="expCsv" class="p">Export CSV</button>
</header>
<main>
  <p class="hint">For each unit decide whether the English translates exactly the Sanskrit shown (the scored pair). Keys 1-6 pick a mark on the focused unit, N or J goes to the next, K to the previous. Marks save in this browser as you go; export when done.</p>
  <div id="results" class="res" hidden></div>
  <div id="list"></div>
</main>
<script>
const DATA = __PAYLOAD__;
const KEY = "grantha-audit-" + DATA.seed;
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const list = $("#list");
let focus = 0;

function card(u, i) {
  const m = marks[u.id] || {};
  const el = document.createElement("section");
  el.className = "unit" + (m.label ? " done" : "");
  el.dataset.id = u.id;
  const parts = u.parts.length ? `<details><summary>${u.parts.length} parts (mula, bhashya, tatparya)</summary>${u.parts.map(p => `<p class="lab">${p.role}</p><div class="box sk">${esc(p.sanskrit)}</div><div class="box" style="margin-top:6px">${esc(p.english) || "(no english)"}</div>`).join("")}</details>` : "";
  el.innerHTML = `<div class="meta"><b>${i + 1}. ${esc(u.work)}</b><span>${esc(u.author)}</span><span>${u.scope} ${u.kind}</span><span>${u.reftype}</span><code>${esc(u.id)}</code></div>
  <div class="cols"><div><p class="lab">Sanskrit (${u.sanskrit.length} chars)</p><div class="box sk">${esc(u.sanskrit)}</div></div>
  <div><p class="lab">English (${u.english.length} chars)</p><div class="box">${esc(u.english)}</div></div></div>${parts}
  <div class="opts">${DATA.labels.map((l, k) => `<label title="${esc(l[2])}"><input type="radio" name="r${i}" value="${l[0]}" ${m.label === l[0] ? "checked" : ""}>${k + 1}. ${l[1]}</label>`).join("")}</div>
  <input class="note" placeholder="note (optional)" value="${esc(m.note || "")}">`;
  el.addEventListener("change", e => {
    if (e.target.type === "radio") { marks[u.id] = { ...(marks[u.id] || {}), label: e.target.value }; el.classList.add("done"); save(); progress(); }
  });
  $(".note", el).addEventListener("input", e => { marks[u.id] = { ...(marks[u.id] || {}), note: e.target.value }; save(); });
  el.addEventListener("click", () => { focus = i; });
  return el;
}
DATA.units.forEach((u, i) => list.appendChild(card(u, i)));

function progress() {
  const done = DATA.units.filter(u => marks[u.id] && marks[u.id].label).length;
  $("#count").textContent = `${done} of ${DATA.units.length} marked`;
  $("#bar").style.width = (100 * done / DATA.units.length) + "%";
  applyFilter();
}
function applyFilter() {
  const f = $("#filter").value;
  [...list.children].forEach(el => {
    const m = marks[el.dataset.id] || {};
    const wrong = m.label && !["ok", "na"].includes(m.label);
    el.hidden = (f === "todo" && m.label) || (f === "bad" && !wrong);
  });
}
$("#filter").addEventListener("change", applyFilter);

function stats() {
  const by = {};
  DATA.strata.forEach(s => by[s.file] = { ...s, judged: 0, wrong: 0 });
  DATA.units.forEach(u => {
    const m = marks[u.id]; if (!m || !m.label || m.label === "na") return;
    by[u.file].judged++; if (m.label !== "ok") by[u.file].wrong++;
  });
  let N = 0, est = 0;
  Object.values(by).forEach(s => { if (s.judged) { N += s.n; est += s.n * s.wrong / s.judged; } });
  return { by, overall: N ? est / N : null, covered: N };
}
function wilson(k, n) { if (!n) return ["", ""]; const z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n), a = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)); return [Math.max(0, (c - a) / d), Math.min(1, (c + a) / d)]; }
$("#resBtn").addEventListener("click", () => {
  const r = $("#results"); r.hidden = !r.hidden; if (r.hidden) return;
  const s = stats(); const rows = Object.values(s.by).filter(x => x.judged);
  const pc = x => x === "" ? "" : (100 * x).toFixed(0) + "%";
  r.innerHTML = `<p><b>Corpus-wide error rate (weighted by file size): ${s.overall === null ? "n/a" : (100 * s.overall).toFixed(1) + "%"}</b> <span class="hint">over ${s.covered} units in files with at least one judged unit</span></p>
  <table><tr><th>Work</th><th class="n">Judged</th><th class="n">Wrong</th><th class="n">Rate</th><th class="n">95% interval</th></tr>${rows.sort((a, b) => b.wrong / b.judged - a.wrong / a.judged).map(x => { const [lo, hi] = wilson(x.wrong, x.judged); return `<tr><td>${esc(x.work)} ${esc(x.author)}</td><td class="n">${x.judged}</td><td class="n">${x.wrong}</td><td class="n">${pc(x.wrong / x.judged)}</td><td class="n">${pc(lo)} to ${pc(hi)}</td></tr>`; }).join("")}</table>`;
});

function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }
$("#expJson").addEventListener("click", () => download("audit-marks.json", JSON.stringify({ seed: DATA.seed, strata: DATA.strata, marks }, null, 1), "application/json"));
$("#expCsv").addEventListener("click", () => {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [["id", "file", "label", "note"]].concat(DATA.units.map(u => { const m = marks[u.id] || {}; return [u.id, u.file, m.label || "", m.note || ""]; }));
  download("audit-marks.csv", rows.map(r => r.map(q).join(",")).join("\n"), "text/csv");
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.target.classList && e.target.classList.contains("note")) return;
  const cards = [...list.children].filter(c => !c.hidden);
  const cur = cards.findIndex(c => c.dataset.id === DATA.units[focus].id);
  if (/^[1-6]$/.test(e.key)) { const u = DATA.units[focus]; const l = DATA.labels[+e.key - 1][0]; marks[u.id] = { ...(marks[u.id] || {}), label: l }; save(); const el = list.children[focus]; el.replaceWith(card(u, focus)); progress(); }
  if (e.key === "n" || e.key === "j") { const nx = cards[Math.min(cards.length - 1, cur + 1)]; if (nx) { focus = [...list.children].indexOf(nx); nx.scrollIntoView({ block: "start" }); } }
  if (e.key === "k") { const pv = cards[Math.max(0, cur - 1)]; if (pv) { focus = [...list.children].indexOf(pv); pv.scrollIntoView({ block: "start" }); } }
});
progress();
</script>
</body>
</html>
